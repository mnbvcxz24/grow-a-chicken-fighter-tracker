name = "gcf-push-scheduler"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Runs every minute, forever, for free — this is what checks the schedule
# and fires push notifications even when no phone has the app open.
[triggers]
crons = ["* * * * *"]

# Stores each device's push subscription + which events they want notified about.
# Create this with: wrangler kv:namespace create SUBSCRIPTIONS
[[kv_namespaces]]
binding = "SUBSCRIPTIONS"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"
