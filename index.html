<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grow a Chicken Fighter - Event Tracker</title>
<meta name="theme-color" content="#0f1117">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GCF Tracker">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #0f1117;
    color: #e8e8ec;
    padding: 20px;
    min-height: 100vh;
  }
  .wrap { max-width: 680px; margin: 0 auto; }
  .clock {
    text-align: center;
    font-size: 14px;
    color: #9a9aa5;
    margin-bottom: 20px;
    letter-spacing: 0.5px;
  }
  .clock strong { color: #e8e8ec; font-weight: 600; }
  .live-card {
    background: linear-gradient(135deg, #1a2e1a, #14231a);
    border: 1px solid #2d5a2d;
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 12px;
    position: relative;
    overflow: hidden;
  }
  .badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    padding: 4px 10px;
    border-radius: 20px;
    margin-bottom: 10px;
  }
  .badge-live {
    background: #2ecc71;
    color: #06280f;
  }
  .badge-live::before {
    content: "● ";
  }
  .badge-upcoming {
    background: #f39c12;
    color: #3a2604;
  }
  .event-name {
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .event-sub {
    font-size: 14px;
    color: #a9c9a9;
  }
  .countdown {
    font-size: 32px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    margin-top: 10px;
    color: #7ee8a8;
  }
  .upcoming-card {
    background: #221a0f;
    border: 1px solid #5a4a2d;
    border-radius: 16px;
    padding: 18px 24px;
    margin-bottom: 20px;
  }
  .upcoming-card .event-name { font-size: 20px; color: #f5c877; }
  .upcoming-card .countdown { font-size: 24px; color: #f5c877; }
  .hidden { display: none; }
  h2 {
    font-size: 15px;
    font-weight: 600;
    color: #9a9aa5;
    margin: 24px 0 10px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    background: #171922;
    border-radius: 12px;
    overflow: hidden;
    font-size: 14px;
  }
  th {
    text-align: left;
    padding: 10px 14px;
    color: #7a7a85;
    font-weight: 600;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    background: #1c1e28;
  }
  td {
    padding: 10px 14px;
    border-top: 1px solid #22242e;
  }
  tr.row-live td { background: rgba(46, 204, 113, 0.08); }
  tr.row-upcoming td { background: rgba(243, 156, 18, 0.06); }
  .status-pill {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 10px;
  }
  .status-pill.live { background: #2ecc71; color: #06280f; }
  .status-pill.upcoming { background: #f39c12; color: #3a2604; }
  .event-icon { margin-right: 6px; }
  footer {
    text-align: center;
    font-size: 12px;
    color: #5a5a65;
    margin-top: 24px;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="clock">Philippine time: <strong id="clock">--:--:--</strong></div>

  <div class="upcoming-card hidden" id="upcoming-card">
    <span class="badge badge-upcoming">UPCOMING</span>
    <div class="event-name" id="upcoming-event">--</div>
    <div class="countdown" id="upcoming-countdown">--:--</div>
  </div>

  <div class="live-card" id="live-card">
    <span class="badge badge-live">LIVE</span>
    <div class="event-name" id="live-event">--</div>
    <div class="event-sub">Ends at <span id="live-end">--</span></div>
    <div class="countdown" id="live-countdown">--:--</div>
  </div>

  <h2>Next 1 hour schedule</h2>
  <table>
    <thead>
      <tr><th>PH time</th><th>Status</th><th>Event</th></tr>
    </thead>
    <tbody id="schedule-body"></tbody>
  </table>

  <footer>Grow a Chicken Fighter event tracker &middot; cycle: UFO Invasion &rarr; Chicken Boss &rarr; Golden Goose &rarr; Hot Egg (10 min each)</footer>
</div>

<script>
const EVENTS = ["UFO invasion", "Chicken boss", "Golden goose", "Hot egg"];
const ANCHOR_MIN = 17 * 60; // 5:00 PM anchor = start of UFO invasion
const CYCLE = 40; // minutes
const UPCOMING_OFFSET = 3; // minutes into the block before it switches to UPCOMING

const phFormatter = new Intl.DateTimeFormat('en-US', {
  timeZone: 'Asia/Manila', hour12: false,
  hour: '2-digit', minute: '2-digit', second: '2-digit'
});

function getPHMinutes() {
  const parts = phFormatter.formatToParts(new Date());
  const obj = {};
  parts.forEach(p => obj[p.type] = p.value);
  const h = parseInt(obj.hour, 10) % 24;
  const m = parseInt(obj.minute, 10);
  const s = parseInt(obj.second, 10);
  return h * 60 + m + s / 60;
}

function fmtTimeFromMinutes(totalMin, withSeconds) {
  totalMin = ((totalMin % 1440) + 1440) % 1440;
  let h = Math.floor(totalMin / 60);
  const m = Math.floor(totalMin % 60);
  const s = Math.round((totalMin % 1) * 60);
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12; if (h === 0) h = 12;
  if (withSeconds) {
    return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')} ${ampm}`;
  }
  return `${h}:${String(m).padStart(2,'0')} ${ampm}`;
}

function fmtCountdown(totalSeconds) {
  totalSeconds = Math.max(0, Math.round(totalSeconds));
  const m = Math.floor(totalSeconds / 60);
  const s = totalSeconds % 60;
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function cyclePosAt(t) {
  return (((t - ANCHOR_MIN) % CYCLE) + CYCLE) % CYCLE;
}

function update() {
  const t = getPHMinutes();
  document.getElementById('clock').textContent = fmtTimeFromMinutes(t, true);

  const pos = cyclePosAt(t);
  const eventIndex = Math.floor(pos / 10) % 4;
  const posInBlock = pos % 10;

  const liveEvent = EVENTS[eventIndex];
  const nextEvent = EVENTS[(eventIndex + 1) % 4];
  const liveCard = document.getElementById('live-card');
  const upcomingCard = document.getElementById('upcoming-card');

  if (posInBlock < UPCOMING_OFFSET) {
    liveCard.classList.remove('hidden');
    const minutesToLiveEnd = UPCOMING_OFFSET - posInBlock;
    document.getElementById('live-event').textContent = liveEvent;
    document.getElementById('live-countdown').textContent = fmtCountdown(minutesToLiveEnd * 60);
    document.getElementById('live-end').textContent = fmtTimeFromMinutes(t + minutesToLiveEnd, false);
    upcomingCard.classList.add('hidden');
  } else {
    liveCard.classList.add('hidden');
    upcomingCard.classList.remove('hidden');
    document.getElementById('upcoming-event').textContent = nextEvent;
    const minutesToNext = 10 - posInBlock;
    document.getElementById('upcoming-countdown').textContent = fmtCountdown(minutesToNext * 60);
  }

  buildSchedule(t);
}

function buildSchedule(t) {
  const windowEnd = t + 60;

  let boundaries = [];
  let firstBoundary = Math.floor((t - ANCHOR_MIN) / 10) * 10 + ANCHOR_MIN;
  for (let b = firstBoundary; b <= t + 60 + 10; b += 10) {
    const pos = cyclePosAt(b);
    const idx = Math.floor(pos / 10) % 4;
    boundaries.push({ min: b, type: 'live', event: EVENTS[idx] });
    const upcomingMin = b + UPCOMING_OFFSET;
    const nextIdx = (idx + 1) % 4;
    boundaries.push({ min: upcomingMin, type: 'upcoming', event: EVENTS[nextIdx] });
  }

  boundaries = boundaries.filter(b => b.min >= t - 0.001 && b.min <= windowEnd).sort((a,b) => a.min - b.min);

  const tbody = document.getElementById('schedule-body');
  tbody.innerHTML = '';
  boundaries.forEach(b => {
    const tr = document.createElement('tr');
    tr.className = b.type === 'live' ? 'row-live' : 'row-upcoming';
    const pillClass = b.type === 'live' ? 'live' : 'upcoming';
    const pillLabel = b.type === 'live' ? 'LIVE' : 'UPCOMING';
    tr.innerHTML = `<td>${fmtTimeFromMinutes(b.min, false)}</td><td><span class="status-pill ${pillClass}">${pillLabel}</span></td><td>${b.event}</td>`;
    tbody.appendChild(tr);
  });
}

update();
setInterval(update, 1000);

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}
</script>
</body>
</html>
